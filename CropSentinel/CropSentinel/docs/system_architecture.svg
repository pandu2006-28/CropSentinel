<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65758b"/></marker></defs><rect width="1440" height="680" rx="24" fill="#f4f7fb"/><text x="55" y="55" font-family="Arial" font-size="30" font-weight="700" fill="#1b2a4a">CropSentinel — proposed trust-aware alert pipeline</text><text x="55" y="88" font-family="Arial" font-size="16" fill="#63738a">Conceptual architecture only · not a wiring schematic or evidence of a completed prototype</text><style>.b{fill:#fff;stroke:#cbd6e4;stroke-width:2;rx:15}.h{font:700 19px Arial;fill:#1b2a4a}.t{font:15px Arial;fill:#53647a}.a{stroke:#65758b;stroke-width:3;fill:none;marker-end:url(#a)}</style><rect class="b" x="55" y="170" width="220" height="130"/><text class="h" x="165" y="210" text-anchor="middle">Camera capture</text><text class="t" x="165" y="242" text-anchor="middle">Tomato leaf image</text><text class="t" x="165" y="267" text-anchor="middle">Board/lens TBD</text><rect class="b" x="335" y="170" width="245" height="130"/><text class="h" x="457" y="210" text-anchor="middle">Image-quality gate</text><text class="t" x="457" y="242" text-anchor="middle">Blur · exposure</text><text class="t" x="457" y="267" text-anchor="middle">Occlusion · framing</text><rect class="b" x="640" y="170" width="220" height="130"/><text class="h" x="750" y="210" text-anchor="middle">Edge classifier</text><text class="t" x="750" y="242" text-anchor="middle">Healthy / Early / Late</text><text class="t" x="750" y="267" text-anchor="middle">Model not trained here</text><rect class="b" x="920" y="170" width="270" height="130"/><text class="h" x="1055" y="210" text-anchor="middle">Reliability policy</text><text class="t" x="1055" y="242" text-anchor="middle">Confidence + margin</text><text class="t" x="1055" y="267" text-anchor="middle">Quality + history (future)</text><path class="a" d="M275 235 H325"/><path class="a" d="M580 235 H630"/><path class="a" d="M860 235 H910"/><rect class="b" x="335" y="380" width="245" height="105" style="stroke:#d8a24c"/><text class="h" x="457" y="420" text-anchor="middle">Recapture</text><text class="t" x="457" y="450" text-anchor="middle">Poor-quality image</text><rect class="b" x="640" y="380" width="220" height="105" style="stroke:#d8a24c"/><text class="h" x="750" y="420" text-anchor="middle">Human review</text><text class="t" x="750" y="450" text-anchor="middle">Uncertain prediction</text><rect class="b" x="920" y="380" width="270" height="105" style="stroke:#5da986"/><text class="h" x="1055" y="420" text-anchor="middle">Possible-disease alert</text><text class="t" x="1055" y="450" text-anchor="middle">Not a definitive diagnosis</text><path class="a" d="M457 300 V370"/><path class="a" d="M1055 300 V370"/><path class="a" d="M980 300 C930 335 860 340 810 370"/><rect class="b" x="335" y="535" width="855" height="85"/><text class="h" x="762" y="570" text-anchor="middle">Direct LoRa → farmer-side receiver</text><text class="t" x="762" y="597" text-anchor="middle">Display + buzzer/LED + user ACK · ACK is not inspection proof</text><path class="a" d="M1055 485 V525"/><text class="t" x="55" y="650">BME280-class environmental sensor is proposed as context only until validated.</text></svg>